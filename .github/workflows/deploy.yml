name: Deploy SECOF

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 216.238.81.192
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/secof
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm build
            pm2 restart secof
            echo "✅ Deploy completado $(date)"
